name: Keep Streamlit App Awake

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Streamlit App
        run: |
          URL="https://genccobro-rwxh2xrpumqufkgqksuct.streamlit.app"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 --max-redirs 0 "$URL" || echo "000")
          echo "HTTP status: $STATUS"
          if [[ "$STATUS" =~ ^[23] ]]; then
            echo "OK: App activa (status $STATUS)"
          else
            echo "AVISO: Respuesta inesperada: $STATUS"
            exit 1
          fi